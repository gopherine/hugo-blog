baseURL='https://atharva.page/'
languageCode='en-us'
title='Atharva Pandey'
copyright="Copyright ©"
# theme imported via module.imports below

[security]
[security.funcs]
getenv = ['^HUGO_', '^CI$', '^GITHUB_TOKEN$']

[module]
[[module.imports]]
path = "atharva"
[[module.imports.mounts]]
source = "layouts"
target = "layouts"
[[module.imports.mounts]]
source = "static"
target = "static"
[[module.imports.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "archetypes"
target = "archetypes"

[minify]
disableCSS=false
disableHTML=false
disableJS=false
disableJSON=false
disableSVG=false
disableXML=false
minifyOutput=true
[minify.tdewolff]
[minify.tdewolff.css]
version=2
precision=0
[minify.tdewolff.html]
keepComments=false
keepSpecialComments=false
keepDefaultAttrVals=true
keepDocumentTags=true
keepEndTags=true
keepQuotes=false
keepWhitespace=false
[minify.tdewolff.js]
keepVarNames=false
precision=0
version=2022
[minify.tdewolff.json]
keepNumbers=false
precision=0
[minify.tdewolff.svg]
keepComments=false
precision=0
[minify.tdewolff.xml]
keepWhitespace=false


[markup]
[markup.highlight]
noClasses = false
lineNos = false

[taxonomies]
tag = 'tags'
category = 'categories'
series = 'series'

[params]
description = "Polyglot Engineer · Technical Leader. I ship AI-native tools, distributed systems, and developer platforms in Go, Rust, and TypeScript."
github = "gopherine"
linkedin = "atharvapandey"
twitter = "vedaatharva"
email = "atharvajava@gmail.com"
monogram = "AP"

[[deployment.matchers]]
# Cache static assets for 1 year.
pattern = "^.+\\.(js|css|svg|ttf|woff2)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg|gif|webp)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true