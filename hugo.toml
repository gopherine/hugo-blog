[security]
[security.funcs]
getenv = ['^HUGO_', '^CI$', '^GITHUB_TOKEN$']

baseURL='https://atharvapandey.com/'
languageCode='en-us'
title='Atharva Pandey'
# theme imported via module.imports below
copyright="Copyright ©"

[module]
[[module.imports]]
path = "github-style"
[[module.imports.mounts]]
source = "layouts"
target = "layouts"
[[module.imports.mounts]]
source = "static"
target = "static"
[[module.imports.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "assets"
target = "assets"
[[module.mounts]]
source = "i18n"
target = "i18n"
[[module.mounts]]
source = "archetypes"
target = "archetypes"
[[module.mounts]]
source = "hugo_stats.json"
target = "assets/watching/hugo_stats.json"

[build]
writeStats=true
[[build.cachebusters]]
source="assets/watching/hugo_stats\\.json"
target="styles\\.css"
[[build.cachebusters]]
source="postcss\\.config\\.js"
target="css"
[[build.cachebusters]]
source="assets/.*\\.(js|ts|jsx|tsx)"
target="js"
[[build.cachebusters]]
source="assets/.*\\.(.*)$"
target="$1"

[minify]
disableCSS=false
disableHTML=false
disableJS=false
disableJSON=false
disableSVG=false
disableXML=false
minifyOutput=true
[minify.tdewolff]
[minify.tdewolff.css]
version=2
precision=0
[minify.tdewolff.html]
keepComments=false
keepSpecialComments=false
keepDefaultAttrVals=true
keepDocumentTags=true
keepEndTags=true
keepQuotes=false
keepWhitespace=false
[minify.tdewolff.js]
keepVarNames=false
precision=0
version=2022
[minify.tdewolff.json]
keepNumbers=false
precision=0
[minify.tdewolff.svg]
keepComments=false
precision=0
[minify.tdewolff.xml]
keepWhitespace=false


[params]
description = "Polyglot Engineer · Technical Leader. I ship AI-native tools, distributed systems, and developer platforms in Go, Rust, and TypeScript."

[params.microblog]
enabled = true
repo = "gopherine/hugo-blog"
author = "Gopherine"
maxPosts = 20
pinnedLabel = "pinned"
thoughtsCategoryId = "DIC_kwDOLTrS184C468G"
shippedCategoryId = "DIC_kwDOLTrS184C468N"

[[deployment.matchers]]
# Cache static assets for 1 year.
pattern = "^.+\\.(js|css|svg|ttf|woff2)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true

[[deployment.matchers]]
pattern = "^.+\\.(png|jpg|gif|webp)$"
cacheControl = "max-age=31536000, no-transform, public"
gzip = true