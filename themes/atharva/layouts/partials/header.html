<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Title }} — home">
      <img class="brand-logo" src="{{ "images/layer-man.webp" | relURL }}" alt="" width="25" height="32" aria-hidden="true">
      <span class="brand-text" aria-hidden="true">
        <span class="brand-name">{{ .Site.Title }}</span>
        <span class="brand-tagline">{{ with .Site.Params.tagline }}{{ . }}{{ else }}Polyglot Engineer{{ end }}</span>
      </span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a href="{{ "/writing/" | relURL }}"
        class="nav-link{{ if eq .Section "writing" }} is-active{{ end }}">Writing</a>
      <a href="{{ "/series/" | relURL }}"
        class="nav-link{{ if eq .Section "series" }} is-active{{ end }}">Courses</a>
      <a href="{{ "/notes/" | relURL }}"
        class="nav-link{{ if eq .Section "notes" }} is-active{{ end }}">Notes</a>
      <a href="{{ "/readme/" | relURL }}"
        class="nav-link{{ if eq .Section "readme" }} is-active{{ end }}">About</a>
      <a href="{{ "/search/" | relURL }}" class="nav-link nav-link--icon" aria-label="Search">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"></circle>
          <path d="m10.6 10.6 3.4 3.4"></path>
        </svg>
      </a>
      <a href="{{ "index.xml" | relURL }}" class="nav-link nav-link--icon" aria-label="RSS">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M2 13a1 1 0 1 1 2 0 1 1 0 0 1-2 0ZM2 9.5a4.5 4.5 0 0 1 4.5 4.5h-1.7A2.8 2.8 0 0 0 2 11.2V9.5Zm0-3.7a8.2 8.2 0 0 1 8.2 8.2H8.5A6.5 6.5 0 0 0 2 7.5V5.8Zm0-3.7A11.9 11.9 0 0 1 14 14h-1.7A10.2 10.2 0 0 0 2 3.8V2Z"/>
        </svg>
      </a>
      <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0Zm0 13a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13ZM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.75.75 0 0 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06Zm9.193 9.193a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.06ZM16 8a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm10.657-5.657a.75.75 0 0 1 0 1.061l-1.061 1.06a.75.75 0 1 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.06 0Z"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path d="M4.522 7.718A5.478 5.478 0 0 0 10.056 2.184c0-.249-.017-.494-.048-.734a.4.4 0 0 1 .64-.45 6.5 6.5 0 1 1-8.913 8.913.4.4 0 0 1 .45-.64c.24.031.485.048.734.048Z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
