{{/* Reusable social/external links. Pass dict "ctx" . */}}
{{ $ctx := .ctx }}
<div class="social-links" aria-label="Links">
  {{ with $ctx.Site.Params.github }}
  <a class="social-link" href="https://github.com/{{ . }}" rel="me" aria-label="GitHub" title="GitHub">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  </a>
  {{ end }}
  {{ with $ctx.Site.Params.linkedin }}
  <a class="social-link" href="https://linkedin.com/in/{{ . }}" rel="me" aria-label="LinkedIn" title="LinkedIn">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1-.02-5ZM3 9h4v12H3zM10 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C21.4 8.65 22 11 22 14.1V21h-4v-6.1c0-1.45-.03-3.32-2.02-3.32-2.02 0-2.33 1.58-2.33 3.21V21h-4V9Z"/></svg>
  </a>
  {{ end }}
  {{ with $ctx.Site.Params.email }}
  <a class="social-link" href="mailto:{{ . }}" aria-label="Email" title="Email">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>
  </a>
  {{ end }}
  <a class="social-link" href="{{ "index.xml" | relURL }}" aria-label="RSS feed" title="RSS">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 13a1 1 0 1 1 2 0 1 1 0 0 1-2 0ZM2 9.5a4.5 4.5 0 0 1 4.5 4.5h-1.7A2.8 2.8 0 0 0 2 11.2V9.5Zm0-3.7a8.2 8.2 0 0 1 8.2 8.2H8.5A6.5 6.5 0 0 0 2 7.5V5.8Zm0-3.7A11.9 11.9 0 0 1 14 14h-1.7A10.2 10.2 0 0 0 2 3.8V2Z"/></svg>
  </a>
</div>
