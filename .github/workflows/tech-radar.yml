name: Tech Radar Draft Generator

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:

permissions:
  discussions: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Generate tech radar draft
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_ID: "R_kgDOLTrS1w"
        THOUGHTS_CAT_ID: "DIC_kwDOLTrS184C468G"
      run: python3 scripts/tech-radar.py
