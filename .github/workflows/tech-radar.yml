name: Tech Radar Draft Generator

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs: {}

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
    - name: Generate deep technical draft
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_ID: "R_kgDOLTrS1w"
        THOUGHTS_CAT_ID: "DIC_kwDOLTrS184C468G"
      run: |
        python3 << 'PYSCRIPT'
        import json, os, subprocess, urllib.request, xml.etree.ElementTree as ET, re, random
        from datetime import datetime

        def fetch_url(url):
            req = urllib.request.Request(url, headers={"User-Agent": "TechRadar/1.0"})
            with urllib.request.urlopen(req, timeout=10) as r:
                return r.read().decode("utf-8", errors="replace")

        def groq(prompt, max_tokens=800):
            result = subprocess.run(
                ["curl", "-s", "https://api.groq.com/openai/v1/chat/completions",
                 "-H", f"Authorization: Bearer {os.environ['GROQ_API_KEY']}",
                 "-H", "Content-Type: application/json",
                 "-d", json.dumps({"model": "llama-3.3-70b-versatile",
                    "messages": [{"role": "user", "content": prompt}],
                    "temperature": 0.7, "max_tokens": max_tokens})],
                capture_output=True, text=True)
            resp = json.loads(result.stdout)
            return resp["choices"][0]["message"]["content"]

        # ---- SOURCE 1: GitHub Trending (Go, Rust, TypeScript) ----
        print("Fetching GitHub Trending...")
        gh_items = []
        for lang in ["go", "rust", "typescript"]:
            try:
                data = fetch_url(f"https://api.github.com/search/repositories?q=created:>{datetime.now().strftime('%Y-%m-%d')[:8]01+language:{lang}&sort=stars&order=desc&per_page=5")
                repos = json.loads(data).get("items", [])
                for r in repos[:3]:
                    readme = ""
                    try:
                        readme_data = fetch_url(f"https://api.github.com/repos/{r['full_name']}/readme")
                        readme_json = json.loads(readme_data)
                        import base64
                        readme = base64.b64decode(readme_json["content"]).decode("utf-8", errors="replace")[:2000]
                    except: pass
                    gh_items.append({
                        "source": "github",
                        "title": f"{r['full_name']} — {r.get('description', '')}",
                        "url": r["html_url"],
                        "stars": r["stargazers_count"],
                        "lang": lang,
                        "readme": readme[:1500],
                        "description": r.get("description", "")
                    })
            except Exception as e:
                print(f"GitHub {lang}: {e}")

        # ---- SOURCE 2: Lobste.rs (curated engineering) ----
        print("Fetching Lobste.rs...")
        lobster_items = []
        try:
            rss = fetch_url("https://lobste.rs/rss")
            root = ET.fromstring(rss)
            for item in root.findall(".//item")[:10]:
                title = item.findtext("title", "")
                link = item.findtext("link", "")
                desc = item.findtext("description", "")
                tags = [c.text for c in item.findall("category") if c.text]
                relevant = any(t in ["programming", "rust", "go", "ai", "distributed",
                    "performance", "systems", "devops", "ml", "crypto", "typescript",
                    "security", "networking", "compilers"] for t in tags)
                if relevant:
                    lobster_items.append({
                        "source": "lobsters",
                        "title": title,
                        "url": link,
                        "tags": tags,
                        "description": re.sub(r'<[^>]+>', '', desc)[:800]
                    })
        except Exception as e:
            print(f"Lobsters: {e}")

        # ---- SOURCE 3: Hacker News (top technical) ----
        print("Fetching HN...")
        hn_items = []
        try:
            with urllib.request.urlopen("https://hacker-news.firebaseio.com/v0/topstories.json") as r:
                top_ids = json.loads(r.read())[:15]
            for sid in top_ids:
                try:
                    with urllib.request.urlopen(f"https://hacker-news.firebaseio.com/v0/item/{sid}.json") as r:
                        story = json.loads(r.read())
                        if story.get("score", 0) > 100 and story.get("url"):
                            hn_items.append({
                                "source": "hn",
                                "title": story["title"],
                                "url": story["url"],
                                "score": story["score"]
                            })
                            if len(hn_items) >= 5: break
                except: continue
        except Exception as e:
            print(f"HN: {e}")

        # ---- SOURCE 4: arXiv CS (AI/ML/distributed) ----
        print("Fetching arXiv...")
        arxiv_items = []
        try:
            arxiv_rss = fetch_url("https://rss.arxiv.org/rss/cs.DC+cs.AI+cs.PL+cs.SE")
            root = ET.fromstring(arxiv_rss)
            for item in root.findall(".//{http://purl.org/rss/1.0/}item")[:5]:
                ns = {"rss": "http://purl.org/rss/1.0/", "dc": "http://purl.org/dc/elements/1.1/"}
                title = item.findtext("rss:title", "", ns) or item.findtext("title", "")
                link = item.findtext("rss:link", "", ns) or item.findtext("link", "")
                desc = item.findtext("rss:description", "", ns) or item.findtext("description", "")
                if title:
                    arxiv_items.append({
                        "source": "arxiv",
                        "title": title.strip(),
                        "url": link.strip(),
                        "abstract": re.sub(r'<[^>]+>', '', desc)[:1000]
                    })
        except Exception as e:
            print(f"arXiv: {e}")

        print(f"Sources: {len(gh_items)} GitHub, {len(lobster_items)} Lobsters, {len(hn_items)} HN, {len(arxiv_items)} arXiv")

        # ---- Build context for AI ----
        all_items = []

        for item in gh_items:
            all_items.append(f"[GitHub/{item['lang']}] {item['title']}\nURL: {item['url']}\nStars: {item['stars']}\nREADME excerpt: {item['readme'][:800]}")

        for item in lobster_items:
            all_items.append(f"[Lobsters] {item['title']} (tags: {', '.join(item['tags'])})\nURL: {item['url']}\nContent: {item['description'][:500]}")

        for item in hn_items:
            all_items.append(f"[HN/{item['score']}pts] {item['title']}\nURL: {item['url']}")

        for item in arxiv_items:
            all_items.append(f"[arXiv] {item['title']}\nURL: {item['url']}\nAbstract: {item['abstract'][:500]}")

        if len(all_items) < 2:
            print("Not enough content. Skipping.")
            exit(0)

        context = "\n\n---\n\n".join(all_items[:12])

        # ---- Generate micro-essay ----
        prompt = f"""You are writing a technical micro-essay for senior engineers who build production systems in Go, Rust, and TypeScript. They work on AI/LLM tooling, distributed systems, and developer infrastructure.

Here is today's raw material from GitHub Trending, Lobste.rs, Hacker News, and arXiv:

{context}

YOUR JOB: Pick the ONE most technically interesting item. Read its README/abstract/description carefully. Write a deep technical micro-essay (250-400 words).

DO NOT announce that something launched. Instead, TEACH the reader something they would only know if they read the source code or paper.

GOOD post example:
"Codex uses git worktrees to run subagents in parallel — each agent gets an isolated copy of the repo on a separate branch. This is fork-join parallelism at the repository level. Each worktree is a full checkout, so agents can run builds, edit files, and commit without locks. The merge step is where it gets interesting: if two agents edit the same file, you get a conflict — merge conflicts become your synchronization primitive. This means agent parallelism scales linearly with module independence. Tightly coupled codebases hit a wall. The architectural lesson: if you want AI agents to work in parallel on your code, your code needs clean module boundaries. The agent framework didn't solve coupling — it made coupling visible."

BAD post: "Codex launched subagents that let you work faster. This is exciting for developer productivity."

Your post MUST contain:
- A specific architecture decision or design pattern and WHY it was chosen
- A concrete tradeoff with both sides (benefit AND cost)
- At least one detail the reader would only learn by reading source code/paper, not the headline
- A connection to a broader engineering principle

RULES:
- ZERO marketing words (exciting, innovative, game-changer, powerful, revolutionary)
- ZERO filler intros (In today's world, As engineers, Let's dive in)
- Start with the technical meat in sentence one
- Every sentence must teach or claim something specific
- Write like explaining to a peer over coffee
- Include source URL as markdown link
- Title = a specific technical insight, NOT a topic label

Return ONLY valid JSON: {{"title": "your specific technical claim", "body": "your micro-essay"}}"""

        print("Generating with Groq...")
        content = groq(prompt, max_tokens=800)
        start = content.find("{")
        end = content.rfind("}") + 1
        post = json.loads(content[start:end])

        title = post.get("title", "")
        body = post.get("body", "")

        if len(body) < 100:
            print("Content too short. Skipping.")
            exit(0)

        print(f"Generated: {title}")
        print(f"Length: {len(body)} chars")

        # Create draft discussion
        draft_body = f"**DRAFT** — Review before publishing\n\n---\n\n{body}\n\n---\n\n*Auto-generated. Remove [DRAFT] prefix from title to publish to site + LinkedIn.*"
        mutation = json.dumps({"query": f'mutation {{ createDiscussion(input: {{repositoryId: "{os.environ["REPO_ID"]}", categoryId: "{os.environ["THOUGHTS_CAT_ID"]}", title: {json.dumps("[DRAFT] " + title)}, body: {json.dumps(draft_body)}}}) {{ discussion {{ url }} }} }}'})

        result2 = subprocess.run(
            ["curl", "-s", "-X", "POST", "https://api.github.com/graphql",
             "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
             "-H", "Content-Type: application/json",
             "-d", mutation],
            capture_output=True, text=True)

        data = json.loads(result2.stdout)
        url = data.get("data",{}).get("createDiscussion",{}).get("discussion",{}).get("url","unknown")
        print(f"Draft created: {url}")
        PYSCRIPT
