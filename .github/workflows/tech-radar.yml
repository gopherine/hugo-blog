name: Tech Radar Draft Generator

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs: {}

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
    - name: Generate tech radar draft
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO_ID: "R_kgDOLTrS1w"
        THOUGHTS_CAT_ID: "DIC_kwDOLTrS184C468G"
      run: |
        python3 << 'PYSCRIPT'
        import json, os, subprocess, urllib.request

        # Fetch HN top stories
        print("Fetching Hacker News stories...")
        with urllib.request.urlopen("https://hacker-news.firebaseio.com/v0/topstories.json") as r:
            top_ids = json.loads(r.read())[:20]

        stories = []
        for sid in top_ids:
            try:
                with urllib.request.urlopen(f"https://hacker-news.firebaseio.com/v0/item/{sid}.json") as r:
                    story = json.loads(r.read())
                    if story.get("score", 0) > 50 and story.get("title"):
                        stories.append({"title": story["title"], "url": story.get("url",""), "score": story["score"]})
                        if len(stories) >= 8: break
            except: continue

        if len(stories) < 3:
            print("Not enough trending stories. Skipping.")
            exit(0)

        print(f"Found {len(stories)} stories")
        stories_text = "\n".join(f"- {s['title']} ({s['score']} pts) {s['url']}" for s in stories)

        # Generate with Groq (using curl to avoid urllib 403)
        prompt = f"""You are Atharva Pandey, a Polyglot Engineer and Technical Leader who ships AI-native tools and distributed systems in Go, Rust, and TypeScript.

        Trending tech stories from Hacker News:
        {stories_text}

        Pick 3-5 most interesting stories related to: programming, AI/LLM, distributed systems, dev tools, Rust, Go, TypeScript, blockchain/web3, systems engineering.

        Write a short post (150-250 words):
        1. Punchy title specific to the content
        2. Each picked story with 1-2 line sharp technical opinion
        3. Connecting thought at the end about what these trends mean
        4. Confident, technical, slightly opinionated voice
        5. No hashtags, no emojis, no corporate fluff
        6. Include story URLs as markdown links

        Return ONLY valid JSON: {{"title": "your title here", "body": "your post body here"}}"""

        result = subprocess.run(
            ["curl", "-s", "https://api.groq.com/openai/v1/chat/completions",
             "-H", f"Authorization: Bearer {os.environ['GROQ_API_KEY']}",
             "-H", "Content-Type: application/json",
             "-d", json.dumps({"model": "llama-3.3-70b-versatile", "messages": [{"role": "user", "content": prompt}], "temperature": 0.7, "max_tokens": 600})],
            capture_output=True, text=True
        )

        resp = json.loads(result.stdout)
        content = resp["choices"][0]["message"]["content"]
        start = content.find("{")
        end = content.rfind("}") + 1
        post = json.loads(content[start:end])

        title = post.get("title", "Tech Radar")
        body = post.get("body", "")

        if len(body) < 50:
            print("Content too short. Skipping.")
            exit(0)

        print(f"Generated: {title}")

        # Create draft discussion
        draft_body = f"**DRAFT** — Review before publishing\n\n---\n\n{body}\n\n---\n\n*Auto-generated from trending HN stories. Remove [DRAFT] prefix to publish.*"
        mutation = json.dumps({"query": f'mutation {{ createDiscussion(input: {{repositoryId: "{os.environ["REPO_ID"]}", categoryId: "{os.environ["THOUGHTS_CAT_ID"]}", title: {json.dumps("[DRAFT] " + title)}, body: {json.dumps(draft_body)}}}) {{ discussion {{ url }} }} }}'})

        result2 = subprocess.run(
            ["curl", "-s", "-X", "POST", "https://api.github.com/graphql",
             "-H", f"Authorization: Bearer {os.environ['GH_TOKEN']}",
             "-H", "Content-Type: application/json",
             "-d", mutation],
            capture_output=True, text=True
        )

        data = json.loads(result2.stdout)
        url = data.get("data",{}).get("createDiscussion",{}).get("discussion",{}).get("url","unknown")
        print(f"Draft created: {url}")
        PYSCRIPT
