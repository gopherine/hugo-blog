name: Hugo Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issues:
    types: [opened, edited, closed, labeled, unlabeled]
  discussion:
    types: [created, edited, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.158.0'
        extended: true

    - name: Build
      run: npm run build
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_TINA_CLIENT_ID }}
        TINA_TOKEN: ${{ secrets.TINA_TOKEN }}

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./public

  syndicate-linkedin:
    runs-on: ubuntu-latest
    if: github.event_name == 'discussion' && github.event.action == 'created'
    steps:
    - name: Check discussion category and skip drafts
      id: check
      env:
        CATEGORY: ${{ github.event.discussion.category.name }}
        TITLE: ${{ github.event.discussion.title }}
      run: |
        if [[ "$TITLE" == "[DRAFT]"* ]]; then
          echo "Skipping draft post"
          echo "should_post=false" >> "$GITHUB_OUTPUT"
        elif [[ "$CATEGORY" == "Thoughts" || "$CATEGORY" == "Shipped" ]]; then
          echo "should_post=true" >> "$GITHUB_OUTPUT"
        else
          echo "should_post=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Post to LinkedIn
      if: steps.check.outputs.should_post == 'true'
      env:
        LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
        TITLE: ${{ github.event.discussion.title }}
        BODY: ${{ github.event.discussion.body }}
      run: |
        TRUNCATED_BODY=$(echo "$BODY" | head -c 2800)
        POST_TEXT="${TITLE}

        ${TRUNCATED_BODY}

        Read more → https://atharvapandey.com"

        ENCODED_TEXT=$(echo "$POST_TEXT" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')

        curl -s -X POST "https://api.linkedin.com/v2/ugcPosts" \
          -H "Authorization: Bearer $LINKEDIN_ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{
            \"author\": \"urn:li:person:${LINKEDIN_PERSON_ID}\",
            \"lifecycleState\": \"PUBLISHED\",
            \"specificContent\": {
              \"com.linkedin.ugc.ShareContent\": {
                \"shareCommentary\": { \"text\": ${ENCODED_TEXT} },
                \"shareMediaCategory\": \"NONE\"
              }
            },
            \"visibility\": { \"com.linkedin.ugc.MemberNetworkVisibility\": \"PUBLIC\" }
          }"
